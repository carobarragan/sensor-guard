[package]
name = "sensor-guard"
version = "0.1.0"
edition = "2021"
description = "Secure industrial sensor data ingestion API — a DevSecOps portfolio project"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database — SQLite for zero-infra demo; swap for PostgreSQL in production
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }

# Auth & crypto
jsonwebtoken = "9"
# SECURITY: Argon2id is the OWASP-recommended password hashing algorithm.
# It is memory-hard, making GPU/ASIC brute-force attacks impractical.
argon2 = "0.5"

# Input validation
validator = { version = "0.18", features = ["derive"] }

# Rate limiting — prevents brute-force attacks on auth endpoints
tower_governor = "0.4"
governor = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Environment & logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
# Integration testing
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full", "test-util"] }
mockall = "0.13"
